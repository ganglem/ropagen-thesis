name: Compile Thesis

on:
  push:
    branches: [main]
    paths:
      - "thesis/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: thesis
          latexmk_use_lualatex: false
          latexmk_shell_escape: false
          extra_system_packages: "biber"

      - name: Rename PDF
        run: mv thesis/main.pdf thesis/thesis.pdf

      - name: Clean up LaTeX artifacts
        run: |
          cd thesis
          rm -f *.tex *.bib *.aux *.log *.out *.toc *.blg *.bbl *.fdb_latexmk *.fls

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: thesis
          cname: ""