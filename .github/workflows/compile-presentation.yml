name: Compile Presentation

on:
  push:
    branches: [main]
    paths:
      - "thesis/presentation/**"
      - "thesis/bibliography.bib"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compile Beamer slides
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: thesis/presentation
          latexmk_use_lualatex: false
          latexmk_shell_escape: false
          extra_system_packages: "biber"

      - name: Stage PDF
        run: |
          mkdir -p out
          mv thesis/presentation/main.pdf out/presentation.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-pdf
          path: out/presentation.pdf

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          keep_files: true
